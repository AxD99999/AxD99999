  <style>
    text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace; font-size: 14px; white-space: pre; }
    .win { fill: #ffffff; stroke: #d0d7de; }
    .bar { fill: #f6f8fa; }
    .bgfill { fill: #ffffff; }
    .title { font-size: 12px; }
    .fg { fill: #1f2328; } .dim { fill: #656d76; } .key { fill: #0969da; }
    .user { fill: #1a7f37; } .accent { fill: #8250df; } .b { font-weight: 700; }
    .cur { fill: #1f2328; }
    .logo { fill: url(#grad); filter: url(#glow); animation: jitter 5s steps(1) 3s infinite; }
    .gl { opacity: 0; }
    .gl1 { fill: #ff2e88; animation: glitch1 5s steps(1) 3s infinite; }
    .gl2 { fill: #00b8d4; animation: glitch2 5s steps(1) 3s infinite; }
    .typer { animation-fill-mode: both; }
    .typecur { animation: hide 0.01s linear 1.55s both; }
    .in { opacity: 0; animation: slidein .45s cubic-bezier(.2,.8,.2,1) both; }
    .pop { opacity: 0; animation: popin .6s steps(6) both; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .scan { opacity: 0.04; animation: scan 6s linear infinite; pointer-events: none; }
    @keyframes type { from { transform: translateX(0); } to { transform: translateX(var(--w)); } }
    @keyframes hide { to { opacity: 0; } }
    @keyframes slidein { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    @keyframes popin { 0% { opacity: 0; } 30% { opacity: 1; } 45% { opacity: .2; } 60%, 100% { opacity: 1; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(470px); } }
    @keyframes jitter {
      0%, 88%, 100% { transform: none; }
      89% { transform: translate(2px, -1px) skewX(-6deg); }
      91% { transform: translate(-3px, 1px); }
      93% { transform: translate(1px, 0) skewX(4deg); }
    }
    @keyframes glitch1 {
      0%, 88%, 95%, 100% { opacity: 0; transform: none; }
      89% { opacity: .85; transform: translate(-5px, 1px) skewX(8deg); }
      91% { opacity: .7; transform: translate(4px, -2px); }
      93% { opacity: .85; transform: translate(-2px, 0) skewX(-5deg); }
    }
    @keyframes glitch2 {
      0%, 88%, 95%, 100% { opacity: 0; transform: none; }
      89% { opacity: .85; transform: translate(5px, -1px) skewX(-8deg); }
      91% { opacity: .7; transform: translate(-4px, 2px); }
      93% { opacity: .85; transform: translate(3px, 1px) skewX(5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, .in, .pop { animation: none !important; opacity: 1; }
      .gl, .scan, .typer { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969da"/><stop offset=".55" stop-color="#8250df"/>
      <stop offset="1" stop-color="#cf222e"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0969da" stop-opacity="1"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
